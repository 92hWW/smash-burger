<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smash Burger · Երևան</title>
<meta name="description" content="Smash Burger Երևանում. Սմեշ բուրգերներ, կոմբո, հոթ-դոգ, տաք բագետներ. Պատվիրեք զանգով կամ Telegram-ով։">
<meta name="theme-color" content="#2a2826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Golos+Text:wght@400;500;700&family=Noto+Sans+Armenian:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #2a2826;      /* матовая стена из зала */
    --wall-2: #33312e;
    --wall-3: #3d3a36;
    --line: #4a4641;
    --white: #f6f3ee;
    --muted: #b2aba1;
    --orange: #ff5b1f;    /* буквы BURGER на вывеске */
    --cheese: #f4b331;    /* цены на меню-борде */
    --bulb: #ffd99a;

    --display: "Unbounded", "Noto Sans Armenian", system-ui, sans-serif;
    --body: "Golos Text", "Noto Sans Armenian", system-ui, sans-serif;

    --gutter: clamp(16px, 4vw, 40px);
    --max: 1120px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--white);
    font: 400 17px/1.55 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  html[lang="hy"] body { font-family: "Noto Sans Armenian", var(--body); }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cheese); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

  /* ---------- гирлянда ---------- */
  .bulbs {
    position: relative;
    height: 34px;
    overflow: hidden;
  }
  .bulbs svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bulbs .wire { stroke: #15130f; stroke-width: 1.5; fill: none; }
  .bulbs .b { fill: var(--bulb); filter: drop-shadow(0 0 6px rgba(255, 210, 140, .9)); }

  /* ---------- шапка ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(42, 40, 38, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid transparent;
    transition: border-color .2s;
  }
  header.top.scrolled { border-color: var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
  .logo { text-decoration: none; line-height: .9; font: 900 15px/0.95 var(--display); letter-spacing: .02em; }
  .logo span { display: block; }
  .logo .o { color: var(--orange); }
  .top nav { display: flex; gap: 22px; margin-left: 28px; }
  .top nav a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 15px; }
  .top nav a:hover { color: var(--white); }
  .spacer { flex: 1; }
  .langs { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .langs button {
    background: none; border: 0; border-radius: 999px;
    padding: 5px 10px; font-size: 13px; font-weight: 700; color: var(--muted);
  }
  .langs button[aria-pressed="true"] { background: var(--white); color: var(--wall); }
  .cart-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--orange); color: #fff; border: 0; border-radius: 999px;
    padding: 9px 16px; font-weight: 700; font-size: 15px;
  }
  .cart-btn .count {
    min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px;
    background: #fff; color: var(--orange); font-size: 13px;
    display: grid; place-items: center;
  }
  .cart-btn .count:empty { display: none; }

  /* ---------- вывеска ---------- */
  .hero { padding: clamp(40px, 8vw, 96px) 0 clamp(48px, 8vw, 88px); position: relative; overflow: hidden; }
  .hero-low { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .sign {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(58px, 12.5vw, 150px);
    line-height: .86;
    letter-spacing: -.01em;
  }
  .sign span { display: block; }
  .sign .w {
    color: #fff;
    text-shadow: 0 0 4px rgba(255,255,255,.55), 0 0 22px rgba(255,255,255,.28), 0 0 60px rgba(255,255,255,.12);
  }
  .sign .o {
    color: var(--orange);
    letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(255,91,31,.7), 0 0 30px rgba(255,70,20,.45), 0 0 80px rgba(255,60,10,.25);
  }
  .sign-hy {
    margin: 22px 0 0;
    font: 800 clamp(20px, 2.6vw, 28px)/1.1 "Noto Sans Armenian", sans-serif;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .sign-hy b { color: var(--orange); font-weight: 800; }
  .lede { max-width: 30ch; margin: 22px 0 30px; font-size: clamp(18px, 2vw, 21px); color: var(--white); }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 24px; border-radius: 999px; border: 0;
    font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .btn-main { background: var(--orange); color: #fff; }
  .btn-main:hover { background: #ff6e38; }
  .btn-ghost { background: transparent; color: var(--white); box-shadow: inset 0 0 0 2px var(--line); }
  .btn-ghost:hover { box-shadow: inset 0 0 0 2px var(--white); }
  .btn svg { width: 18px; height: 18px; }

  .burger-art { position: relative; flex: 0 1 380px; margin-bottom: -28px; }
  .burger-art svg { width: 100%; height: auto; display: block; }
  .price-tag {
    position: absolute; left: 4%; bottom: 8%;
    background: var(--cheese); color: #241d10;
    font: 800 15px/1.1 var(--display);
    padding: 14px 16px; border-radius: 50%;
    width: 104px; height: 104px; display: grid; place-items: center; text-align: center;
    transform: rotate(-12deg);
  }
  .price-tag small { display: block; font: 500 12px/1.2 var(--body); }

  @media (prefers-reduced-motion: no-preference) {
    .sign .o { animation: flicker 3s .4s both; }
    @keyframes flicker {
      0%   { opacity: .15; text-shadow: none; }
      4%   { opacity: 1; }
      6%   { opacity: .3; text-shadow: none; }
      9%   { opacity: 1; }
      11%  { opacity: .55; }
      14%, 100% { opacity: 1; }
    }
  }

  /* ---------- меню ---------- */
  .menu { padding: 24px 0 72px; }
  .section-title {
    font: 800 clamp(30px, 4.6vw, 48px)/1.05 var(--display);
    margin: 0 0 8px;
  }
  .section-note { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }

  .tabs {
    position: sticky; top: 64px; z-index: 10;
    background: var(--wall);
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 12px var(--gutter); margin: 0 calc(var(--gutter) * -1) 8px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a {
    flex: none; text-decoration: none;
    padding: 8px 14px; border-radius: 999px;
    background: var(--wall-2); color: var(--muted);
    font-weight: 600; font-size: 15px; white-space: nowrap;
  }
  .tabs a.on { background: var(--white); color: var(--wall); }

  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; }
  .cat { padding: 28px 0 8px; break-inside: avoid; }
  .cat h3 {
    font: 800 22px/1.2 var(--display);
    margin: 0 0 6px; color: var(--cheese);
  }
  .cat .note { color: var(--muted); font-size: 15px; margin: 0 0 10px; }
  .row {
    display: grid; grid-template-columns: 1fr auto auto;
    align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px dashed var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 700; font-size: 17px; line-height: 1.3; }
  .row .desc { display: block; color: var(--muted); font-weight: 400; font-size: 14px; margin-top: 2px; }
  .row .price { font: 800 17px/1 var(--display); color: var(--white); white-space: nowrap; }
  .add {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--orange); background: transparent; color: var(--orange);
    display: grid; place-items: center; font-size: 22px; line-height: 1; font-weight: 700;
  }
  .add:hover { background: var(--orange); color: #fff; }
  .stepper { display: flex; align-items: center; gap: 2px; background: var(--orange); border-radius: 999px; padding: 2px; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: #fff; font-size: 20px; font-weight: 700; }
  .stepper button:hover { background: rgba(255,255,255,.18); }
  .stepper output { min-width: 20px; text-align: center; font-weight: 700; color: #fff; }

  /* сет — главный блок меню */
  .set {
    margin: 48px 0 0;
    display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center;
    background: var(--orange); color: #fff;
    border-radius: 28px; padding: 28px clamp(22px, 4vw, 44px);
    position: relative; overflow: hidden;
  }
  .set .eight {
    font: 900 clamp(110px, 16vw, 190px)/.8 var(--display);
    color: #fff; letter-spacing: -.04em;
    text-shadow: 6px 6px 0 rgba(0,0,0,.18);
  }
  .set h3 { font: 800 clamp(24px, 3.2vw, 34px)/1.1 var(--display); margin: 0 0 8px; }
  .set p { margin: 0; font-size: 17px; max-width: 34ch; }
  .set .buy { text-align: right; }
  .set .big-price { font: 900 clamp(30px, 4vw, 42px)/1 var(--display); display: block; margin-bottom: 14px; }
  .set .btn-main { background: #fff; color: var(--orange); }
  .set .btn-main:hover { background: var(--white); }
  .set .stepper { background: #fff; display: inline-flex; }
  .set .stepper button, .set .stepper output { color: var(--orange); }

  /* ---------- где мы ---------- */
  .where { padding: 72px 0 88px; background: var(--wall-2); }
  .where .wrap { display: grid; grid-template-columns: .9fr 1.1fr; gap: 48px; align-items: center; }
  .where figure { margin: 0; border-radius: 24px; overflow: hidden; aspect-ratio: 4 / 5; }
  .where figure img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .facts { list-style: none; padding: 0; margin: 28px 0 32px; display: grid; gap: 20px; }
  .facts li { display: grid; grid-template-columns: 28px 1fr; gap: 14px; }
  .facts svg { width: 24px; height: 24px; color: var(--cheese); margin-top: 2px; }
  .facts strong { display: block; font-weight: 700; }
  .facts span { color: var(--muted); }
  .facts a { color: var(--white); }

  footer { padding: 28px 0 110px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: space-between; }
  footer a { color: var(--muted); }

  /* ---------- корзина ---------- */
  .bar {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30;
    display: none;
    align-items: center; justify-content: space-between; gap: 12px;
    background: var(--orange); color: #fff; border: 0; border-radius: 999px;
    padding: 14px 22px; font-weight: 700; font-size: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .bar.show { display: flex; }
  .bar .sum { font-family: var(--display); }

  .sheet-bg {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(10, 9, 8, .6);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .sheet {
    position: fixed; z-index: 50; top: 0; right: 0; bottom: 0;
    width: min(440px, 100%);
    background: var(--wall-2);
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .open .sheet-bg { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px; border-bottom: 1px solid var(--line); }
  .sheet h2 { margin: 0; font: 800 22px/1.2 var(--display); }
  .x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--wall-3); font-size: 22px; line-height: 1; }
  .sheet .items { flex: 1; overflow-y: auto; padding: 4px 22px; }
  .sheet .row { grid-template-columns: 1fr auto; }
  .sheet .row .price { font-size: 15px; color: var(--muted); font-family: var(--body); font-weight: 500; }
  .empty { padding: 40px 0; color: var(--muted); }
  .empty .btn { margin-top: 16px; }
  .sheet footer { padding: 18px 22px 22px; border-top: 1px solid var(--line); color: var(--white); font-size: 16px; display: grid; gap: 12px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; }
  .total b { font: 900 26px/1 var(--display); color: var(--cheese); }
  .sheet .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .sheet .btn { justify-content: center; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; z-index: 60;
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--white); color: var(--wall); font-weight: 700;
    padding: 12px 18px; border-radius: 999px; transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- адаптив ---------- */
  @media (max-width: 900px) {
    .top nav { display: none; }
    .hero-low { display: block; }
    .burger-art { max-width: 300px; margin: 36px 0 -24px auto; }
    .price-tag { width: 88px; height: 88px; font-size: 13px; }
    .cats { grid-template-columns: 1fr; }
    .set { grid-template-columns: auto 1fr; }
    .set .buy { grid-column: 1 / -1; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .set .big-price { margin: 0; }
    .where .wrap { grid-template-columns: 1fr; }
    .where figure { aspect-ratio: 4 / 3; }
  }
  @media (max-width: 520px) {
    body { font-size: 16px; }
    .top .wrap { gap: 10px; }
    .cart-btn .label { display: none; }
    .langs button { padding: 5px 8px; }
    .set { gap: 16px; }
    .set .eight { font-size: 96px; }
  }
  @media (min-width: 901px) { .bar { display: none !important; } footer { padding-bottom: 40px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="bulbs" aria-hidden="true"><svg id="bulbs" preserveAspectRatio="none"></svg></div>

<header class="top" id="top">
  <div class="wrap">
    <a class="logo" href="#" aria-label="Smash Burger"><span>SMASH</span><span class="o">BURGER</span></a>
    <nav>
      <a href="#menu" data-t="nav.menu"></a>
      <a href="#set" data-t="nav.set"></a>
      <a href="#where" data-t="nav.where"></a>
    </nav>
    <div class="spacer"></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="hy">ՀԱՅ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button>
    </div>
    <button class="cart-btn" data-open-cart>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span class="label" data-t="cart.btn"></span><span class="count" id="count"></span>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <h1 class="sign"><span class="w">SMASH</span><span class="o">BURGER</span></h1>
        <div class="hero-low"><div>
        <p class="sign-hy">ՍՄԵՇ <b>ԲՈՒՐԳԵՐ</b></p>
        <p class="lede" data-t="hero.lede"></p>
        <div class="ctas">
          <a class="btn btn-main" href="#menu" data-t="hero.menu"></a>
          <a class="btn btn-ghost" data-phone-link>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
            <span data-phone-text></span>
          </a>
        </div>
        </div>

      <div class="burger-art" aria-hidden="true">
        <svg viewBox="0 0 400 380">
          <ellipse cx="200" cy="350" rx="160" ry="16" fill="#1d1b19"/>
          <!-- нижняя булка -->
          <path d="M62 290h276c0 30-28 48-62 48H124c-34 0-62-18-62-48Z" fill="#d98a3a"/>
          <!-- котлета 2 -->
          <path d="M52 262c0-14 10-22 26-24 30-4 214-4 244 0 16 2 26 10 26 24 0 12-8 22-24 26-34 6-214 6-248 0-16-4-24-14-24-26Z" fill="#5a3320"/>
          <path d="M66 270c22 8 246 8 268 0" stroke="#3b2014" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 14"/>
          <!-- сыр 2 -->
          <path d="M60 240h280l-20 18-14-6-10 26-14-24-30 10-18-12-24 30-14-28-30 10-20-14-18 22-12-22-24 8-14-14Z" fill="#f4b331"/>
          <!-- котлета 1 -->
          <path d="M56 214c0-14 10-22 26-24 30-4 206-4 236 0 16 2 26 10 26 24 0 12-8 22-24 26-34 6-206 6-240 0-16-4-24-14-24-26Z" fill="#6b3d25"/>
          <path d="M70 222c22 8 238 8 260 0" stroke="#3b2014" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 14"/>
          <!-- сыр 1 -->
          <path d="M64 192h272l-18 16-16-4-8 30-16-26-26 8-20-12-20 34-16-30-28 10-22-14-14 24-14-22-22 8-14-12Z" fill="#ffc94a"/>
          <!-- соус -->
          <path d="M76 182c40 10 208 10 248 0l-8 12c-40 6-192 6-232 0Z" fill="#ff5b1f"/>
          <!-- верхняя булка -->
          <path d="M60 182c0-80 62-128 140-128s140 48 140 128c0 6-4 10-10 10H70c-6 0-10-4-10-10Z" fill="#e3964a"/>
          <path d="M92 150c8-50 52-78 108-78" stroke="#f0b46e" stroke-width="10" stroke-linecap="round" fill="none" opacity=".7"/>
          <g fill="#fbe7c4">
            <ellipse cx="150" cy="104" rx="7" ry="4" transform="rotate(-20 150 104)"/>
            <ellipse cx="200" cy="90" rx="7" ry="4"/>
            <ellipse cx="248" cy="104" rx="7" ry="4" transform="rotate(20 248 104)"/>
            <ellipse cx="176" cy="132" rx="7" ry="4" transform="rotate(-10 176 132)"/>
            <ellipse cx="226" cy="130" rx="7" ry="4" transform="rotate(12 226 130)"/>
            <ellipse cx="124" cy="140" rx="7" ry="4" transform="rotate(-30 124 140)"/>
            <ellipse cx="278" cy="142" rx="7" ry="4" transform="rotate(30 278 142)"/>
          </g>
        </svg>
        <div class="price-tag"><div><small data-t="hero.from"></small>1200 ֏</div></div>
      </div>
      </div>
      </div>
    </div>
  </section>

  <section class="menu" id="menu">
    <div class="wrap">
      <h2 class="section-title" data-t="menu.title"></h2>
      <p class="section-note" data-t="menu.note"></p>
      <nav class="tabs" id="tabs" aria-label="Menu sections"></nav>
      <div class="cats" id="cats"></div>

      <div class="set" id="set">
        <div class="eight" aria-hidden="true">8</div>
        <div>
          <h3>Smash Set</h3>
          <p data-t="set.desc"></p>
        </div>
        <div class="buy">
          <span class="big-price">6400 ֏</span>
          <span id="set-ctl"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="where" id="where">
    <div class="wrap">
      <figure><img src="img/sign-en.webp" alt="Smash Burger sign" loading="lazy"></figure>
      <div>
        <h2 class="section-title" data-t="where.title"></h2>
        <ul class="facts">
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
            <div><strong data-t="where.address"></strong><span data-cfg="address"></span></div>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div><strong data-t="where.hours"></strong><span data-cfg="hours"></span></div>
          </li>
          <li>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
            <div><strong data-t="where.phone"></strong><a data-phone-link><span data-phone-text></span></a></div>
          </li>
        </ul>
        <div class="ctas">
          <a class="btn btn-main" id="map-link" target="_blank" rel="noopener" data-t="where.map"></a>
          <a class="btn btn-ghost" id="ig-link" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">

      { id: "amber", price: 1200, n: { hy: "Ամբեր", ru: "Амбер", en: "Amber" }, d: { hy: "Գարեջուր, 0.33 լ", ru: "Пиво, 0,33 л", en: "Beer, 0.33 l" } },
      { id: "cola", price: 500, n: { hy: "Կոլա", ru: "Кола", en: "Cola" }, d: { hy: "0.25 լ", ru: "0,25 л", en: "0.25 l" } },
      { id: "water", price: 400, n: { hy: "Ջուր", ru: "Вода", en: "Water" }, d: { hy: "0.5 լ", ru: "0,5 л", en: "0.5 l" } }
    ] }

const SET = { id: "set", price: 6400, n: { hy: "Սմեշ սեթ", ru: "Смэш сет", en: "Smash set" } };

/* ===== ТЕКСТЫ ===== */
const T = {
  hy: {
    "nav.menu": "Մենյու", "nav.set": "Սեթ", "nav.where": "Որտեղ ենք",
    "cart.btn": "Պատվեր",
    "hero.lede": "Կոտլետը սեղմում ենք տաք գրիլին․ դրսից խրթխրթան, ներսից հյութալի։",
    "hero.menu": "Բացել մենյուն", "hero.from": "սկսած",
    "menu.title": "Մենյու", "menu.note": "Ընտրեք ուտեստները, իսկ պատվերը ուղարկեք Telegram-ով կամ զանգահարեք։",
    "set.desc": "8 մինի բուրգեր, 2 ֆրի և 2 սոուս։ Ընկերների համար։",
    "where.title": "Արի մեզ մոտ", "where.address": "Հասցե", "where.hours": "Աշխատանքային ժամեր", "where.phone": "Հեռախոս",
    "where.map": "Բացել քարտեզում",
    "footer.made": "Կայքը՝ Arevsoft",

    "cart.title": "Ձեր պատվերը", "cart.total": "Ընդամենը", "cart.tg": "Ուղարկել Telegram-ով", "cart.call": "Զանգահարել",

    "cart.empty": "Պատվերը դեռ դատարկ է։", "cart.pick": "Ընտրել մենյուից",
    "add": "Ավելացնել", "added": "Ավելացվեց", "copied": "Պատվերը պատճենվեց",
    "msg.head": "Բարև։ Ուզում եմ պատվիրել՝", "msg.total": "Ընդամենը"
  },
  ru: {
    "nav.menu": "Меню", "nav.set": "Сет", "nav.where": "Где мы",
    "cart.btn": "Заказ",
    "hero.lede": "Котлету прижимаем к раскалённому грилю: снаружи хрустящая корочка, внутри сочно.",
    "hero.menu": "Открыть меню", "hero.from": "от",
    "menu.title": "Меню", "menu.note": "Соберите заказ и отправьте его в Telegram или просто позвоните.",
    "set.desc": "8 мини-бургеров, 2 порции фри и 2 соуса. На компанию.",
    "where.title": "Приходите", "where.address": "Адрес", "where.hours": "Часы работы", "where.phone": "Телефон",
    "where.map": "Открыть на карте",
    "footer.made": "Сайт сделал Arevsoft",
    "bar.label": "Заказ",
    "cart.title": "Ваш заказ", "cart.total": "Итого", "cart.tg": "Отправить в Telegram", "cart.call": "Позвонить",
    "cart.hint": "Текст заказа скопируется. В Telegram просто вставьте его в чат.",
    "cart.empty": "В заказе пока пусто.", "cart.pick": "Выбрать в меню",
    "add": "Добавить", "added": "Добавлено", "copied": "Заказ скопирован",
    "msg.head": "Здравствуйте! Хочу заказать:", "msg.total": "Итого"
  },
  en: {
    "nav.menu": "Menu", "nav.set": "Set", "nav.where": "Find us",
    "cart.btn": "Order",
    "hero.lede": "Patties smashed on a hot grill: crispy edges, juicy inside.",
    "hero.menu": "See the menu", "hero.from": "from",
    "menu.title": "Menu", "menu.note": "Build your order and send it on Telegram, or just give us a call.",
    "set.desc": "8 mini burgers, 2 fries and 2 sauces. Made for sharing.",
    "where.title": "Come by", "where.address": "Address", "where.hours": "Opening hours", "where.phone": "Phone",
    "where.map": "Open in maps",
    "footer.made": "Website by Arevsoft",
    "bar.label": "Your order",
    "cart.title": "Your order", "cart.total": "Total", "cart.tg": "Send on Telegram", "cart.call": "Call us",
    "cart.hint": "We copy the order text for you. Paste it into the Telegram chat.",
    "cart.empty": "Your order is empty.", "cart.pick": "Pick from the menu",
    "add": "Add", "added": "Added", "copied": "Order copied",
    "msg.head": "Hi! I'd like to order:", "msg.total": "Total"
  }
};

/* ===== ЛОГИКА ===== */
const ALL = Object.fromEntries([SET, ...MENU.flatMap(c => c.items)].map(i => [i.id, i]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let lang = store.get("sb-lang", "hy");
if (!T[lang]) lang = "hy";
let cart = store.get("sb-cart", {});
for (const id in cart) if (!ALL[id] || cart[id] < 1) delete cart[id];

const $ = s => document.querySelector(s);
const t = k => T[lang][k] ?? k;
const fmt = n => n.toLocaleString("ru-RU").replace(/ /g, " ") + " ֏";

function control(id) {
  const q = cart[id] || 0;
  if (!q) return `<button class="add" data-add="${id}" aria-label="${t("add")}: ${ALL[id].n[lang]}">+</button>`;
  return `<span class="stepper"><button data-dec="${id}" aria-label="−">−</button><output>${q}</output><button data-add="${id}" aria-label="+">+</button></span>`;
}

function renderMenu() {
  $("#tabs").innerHTML = MENU.map(c => `<a href="#cat-${c.id}" data-tab="${c.id}">${c.title[lang]}</a>`).join("")
    + `<a href="#set" data-tab="set">Smash Set</a>`;
  $("#cats").innerHTML = MENU.map(c => `
    <div class="cat" id="cat-${c.id}">
      <h3>${c.title[lang]}</h3>
      ${c.note ? `<p class="note">${c.note[lang]}</p>` : ""}
      ${c.items.map(i => `
        <div class="row">
          <span class="name">${i.n[lang]}${i.d ? `<span class="desc">${i.d[lang]}</span>` : ""}</span>
          <span class="price">${fmt(i.price)}</span>
          <span data-ctl="${i.id}">${control(i.id)}</span>
        </div>`).join("")}
    </div>`).join("");
  $("#set-ctl").innerHTML = cart.set
    ? control("set")
    : `<button class="btn btn-main" data-add="set">${t("add")}</button>`;
}

function renderCart() {
  const ids = Object.keys(cart);
  const count = ids.reduce((s, id) => s + cart[id], 0);
  const total = ids.reduce((s, id) => s + cart[id] * ALL[id].price, 0);
  $("#count").textContent = count || "";
  $("#bar").classList.toggle("show", count > 0);
  $("#bar-sum").textContent = fmt(total);
  $("#cart-total").textContent = fmt(total);
  $("#cart-foot").hidden = !count;
  $("#cart-items").innerHTML = count
    ? ids.map(id => `
      <div class="row">
        <span class="name">${ALL[id].n[lang]}<span class="desc">${fmt(ALL[id].price * cart[id])}</span></span>
        <span data-ctl="${id}">${control(id)}</span>
      </div>`).join("")
    : `<div class="empty"><p>${t("cart.empty")}</p><a class="btn btn-ghost" href="#menu" data-close-cart>${t("cart.pick")}</a></div>`;
  store.set("sb-cart", cart);
}

function orderText() {
  const lines = Object.keys(cart).map(id => `• ${ALL[id].n[lang]} × ${cart[id]} = ${fmt(ALL[id].price * cart[id])}`);
  const total = Object.keys(cart).reduce((s, id) => s + cart[id] * ALL[id].price, 0);
  return `${t("msg.head")}\n${lines.join("\n")}\n${t("msg.total")}: ${fmt(total)}`;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-cfg]").forEach(el => el.textContent = CONFIG[el.dataset.cfg][lang]);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderMenu(); renderCart();
  io.disconnect();
  MENU.forEach(c => io.observe(document.getElementById(`cat-${c.id}`)));
  io.observe($("#set"));
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

function change(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] < 1) delete cart[id];
  renderCart();
  document.querySelectorAll(`[data-ctl="${id}"]`).forEach(el => el.innerHTML = control(id));
  if (id === "set") $("#set-ctl").innerHTML = cart.set ? control("set") : `<button class="btn btn-main" data-add="set">${t("add")}</button>`;
  if (d > 0 && cart[id] === 1) toast(`${t("added")}: ${ALL[id].n[lang]}`);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-add],[data-dec],[data-lang],[data-open-cart],[data-close-cart]");
  if (!el) return;
  if (el.dataset.add) change(el.dataset.add, 1);
  else if (el.dataset.dec) change(el.dataset.dec, -1);
  else if (el.dataset.lang) { lang = el.dataset.lang; store.set("sb-lang", lang); applyLang(); }
  else if ("openCart" in el.dataset) { document.body.classList.add("open"); $(".sheet .x").focus(); }
  else if ("closeCart" in el.dataset) document.body.classList.remove("open");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.body.classList.remove("open"); });

$("#send-tg").href = `https://t.me/${CONFIG.telegram}`;
$("#send-tg").target = "_blank";
$("#send-tg").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(orderText()); toast(t("copied")); } catch {}
});

document.querySelectorAll("[data-phone-link]").forEach(a => a.href = `tel:${CONFIG.phone}`);
document.querySelectorAll("[data-phone-text]").forEach(s => s.textContent = CONFIG.phoneLabel);
$("#map-link").href = CONFIG.map;
$("#ig-link").href = CONFIG.instagram;
$("#year").textContent = new Date().getFullYear();

/* шапка и активная вкладка меню */
const header = $("#top");
addEventListener("scroll", () => header.classList.toggle("scrolled", scrollY > 40), { passive: true });
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const id = en.target.id === "set" ? "set" : en.target.id.replace("cat-", "");
    document.querySelectorAll("[data-tab]").forEach(a => a.classList.toggle("on", a.dataset.tab === id));
  });
}, { rootMargin: "-45% 0px -50% 0px" });

/* гирлянда как в зале */
function drawBulbs() {
  const svg = $("#bulbs"), w = innerWidth, h = 34;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const span = 92, n = Math.ceil(w / span);
  let path = "M0 4", bulbs = "";
  for (let i = 0; i < n; i++) {
    const x0 = i * span, x1 = x0 + span;
    path += ` Q${x0 + span / 2} 20 ${x1} 4`;
    const bx = x0 + span / 2;
    bulbs += `<line x1="${bx}" y1="12" x2="${bx}" y2="17" stroke="#15130f" stroke-width="2"/><circle class="b" cx="${bx}" cy="22" r="5.5"/>`;
  }
  svg.innerHTML = `<path class="wire" d="${path}"/>${bulbs}`;
}
drawBulbs();
addEventListener("resize", drawBulbs);

applyLang();
</script>
